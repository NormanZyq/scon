# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: disney
  - override /model: basic_merged
  - override /callbacks: no_early_stopping
  - override /trainer: default
  - override /logger: csv

callbacks:
  model_checkpoint:
    save_last: false

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["disney_m"]

seed: 3

trainer:
  # min_epochs: 50
  max_epochs: 300
  # gradient_clip_val: 0.5

model:
  tau: 5.0
  warm_epochs: 10
  gate_mode: mono
  attr_err_weight:  0.5
  rho: 0.05
  reg_lambda: 1
  use_lp_loss: true
  num_pos_samples: 0
  neg_ratio: 1.0

  optimizer:
    _target_: torch.optim.Adam
    lr: 3e-3
    # weight_decay: 1e-2

  # ------
  warmup_encoder:
    num_layers: 2
    hidden_channels: 64
    out_channels: 32
    dropout: 0.3

  encoder_gated:
    k: 8    # smoothness of the gate
    num_layers: 20
    dropout: 0.0
    edge_dropout: 0.5
    gate_mode: mono
    use_layernorm: false
    residual: false

  feature_decoder:
    hidden_channels: ${model.warmup_encoder.out_channels}
    mlp_hidden: 64
    dropout: 0.2

  str_decoder:
    in_dim: ${model.encoder_gated.hidden_channels}
    hid_dim: 64 # default=64
    num_layers: 2
    dropout: 0.3
    sigmoid_s: true

# logger:
